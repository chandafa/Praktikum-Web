    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const toast = document.getElementById('appToast');
      const text = document.getElementById('appToastText');
      if (!toast || !text) return;
      text.textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2200);
    }

    function copyTextToClipboard(text) {
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        showToast('Kode berhasil disalin!');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Kode berhasil disalin!')).catch(fallback);
      } else {
        fallback();
      }
    }

    function highlightSyntax(rawLine) {
      const trimmed = rawLine.trim();
      if (trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('{/*') || trimmed.startsWith('#')) {
        return `<span class="text-slate-400 italic">${escapeHtml(rawLine)}</span>`;
      }
      const tokenRegex = /(\/\/.*$|\/\*[\s\S]*?\*\/)|('[^']*'|\"[^\"]*\"|`[^`]*`)|\b(import|from|function|return|const|let|if|else|export|default|true|false|new)\b|\b(useState|useEffect|onClick|onChange|onSubmit|value|checked|disabled|className|key|children|judul|tugas|daftarTugas|setDaftarTugas|jumlah|setJumlah|teks|setTeks|JSON|localStorage|document|Date|Number|console)\b|\b(\d+)\b/g;

      let result = '';
      let lastIndex = 0;
      let match;
      while ((match = tokenRegex.exec(rawLine)) !== null) {
        if (match.index > lastIndex) {
          result += `<span class="text-slate-100">${escapeHtml(rawLine.slice(lastIndex, match.index))}</span>`;
        }
        const [full, comment, str, kw, hookProp, num] = match;
        if (comment) {
          result += `<span class="text-slate-400 italic">${escapeHtml(full)}</span>`;
        } else if (str) {
          result += `<span class="text-amber-300 font-medium">${escapeHtml(full)}</span>`;
        } else if (kw) {
          result += `<span class="text-pink-400 font-bold">${escapeHtml(full)}</span>`;
        } else if (hookProp) {
          result += `<span class="text-emerald-300 font-semibold">${escapeHtml(full)}</span>`;
        } else if (num) {
          result += `<span class="text-sky-300 font-bold">${escapeHtml(full)}</span>`;
        } else {
          result += `<span class="text-slate-100">${escapeHtml(full)}</span>`;
        }
        lastIndex = tokenRegex.lastIndex;
      }
      if (lastIndex < rawLine.length) {
        result += `<span class="text-slate-100">${escapeHtml(rawLine.slice(lastIndex))}</span>`;
      }
      return result;
    }

        // =====================================================================

          return `
            ${renderSlideHeader(meta, 'Event adalah aksi yang dilakukan pengguna (klik tombol, mengetik di kotak input, atau menekan Enter).')}
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
              <div class="lg:col-span-7 space-y-3.5">
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                  <table class="w-full text-left border-collapse text-xs sm:text-sm">
                    <thead>
                      <tr class="bg-slate-900 text-white">

                    <tbody class="divide-y divide-slate-200">

                <div class="grid grid-cols-2 gap-3">

      document.querySelectorAll('.btn-s7-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          AppState.s7Tab = parseInt(btn.getAttribute('data-s7-tab'), 10);
          renderCurrentSlide(false);
        });
      });
      const btnS7Add = document.getElementById('btnS7SpreadAdd');
      if (btnS7Add) btnS7Add.addEventListener('click', () => {
        const id = AppState.s7Items.length + 1;
        AppState.s7Items = [...AppState.s7Items, { id, judul: `Tugas Praktikum #${id}`, selesai: false }];
        AppState.s7Log = '✅ Spread [...daftar, baru] membuat foto/array baru!';
        renderCurrentSlide(false);
      });
      const btnS7Toggle = document.getElementById('btnS7MapToggle');
      if (btnS7Toggle) btnS7Toggle.addEventListener('click', () => {
        AppState.s7Items = AppState.s7Items.map((it, i) => i === 0 ? { ...it, selesai: !it.selesai } : it);
        AppState.s7Log = '✅ .map() membuat salinan objek { ...tugas, selesai: !tugas.selesai }!';
        renderCurrentSlide(false);
      });
      const btnS7Del = document.getElementById('btnS7FilterDel');
      if (btnS7Del) btnS7Del.addEventListener('click', () => {
        if (AppState.s7Items.length > 0) AppState.s7Items = AppState.s7Items.slice(0, -1);
        AppState.s7Log = '✅ .filter() menghasilkan array baru tanpa item terakhir!';
        renderCurrentSlide(false);
      });
      const btnS7Reset = document.getElementById('btnS7Reset');
      if (btnS7Reset) btnS7Reset.addEventListener('click', () => {
        AppState.s7Items = [
          { id: 1, judul: 'Install Node.js dan Vite', selesai: true },
          { id: 2, judul: 'Pelajari useState', selesai: false }
        ];
        renderCurrentSlide(false);
      });

      // Slide 07 Controlled Form
      const inputS8 = document.getElementById('inputS8Teks');
      if (inputS8) inputS8.addEventListener('input', (e) => {
        AppState.s8Input = e.target.value;
        const pos = e.target.selectionStart;
        renderCurrentSlide(false);
        const el = document.getElementById('inputS8Teks');
        if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
      });
      document.querySelectorAll('.btn-s8-preset').forEach((btn) => {
        btn.addEventListener('click', () => {
          const p = btn.getAttribute('data-s8-preset');
          AppState.s8Input = p === 'ok' ? 'Kerjakan laporan Modul 2' : p === 'long' ? 'Judul tugas ini sengaja dibuat sangat panjang sekali hingga melewati batas maksimal lima puluh karakter' : '';
          renderCurrentSlide(false);
        });
      });

      // Slide 08 Conditional Rendering
      const btnS9Err = document.getElementById('btnS9ToggleError');
      if (btnS9Err) btnS9Err.addEventListener('click', () => { AppState.s9IsError = !AppState.s9IsError; renderCurrentSlide(false); });
      const btnS9Sel = document.getElementById('btnS9ToggleSelesai');
      if (btnS9Sel) btnS9Sel.addEventListener('click', () => { AppState.s9Selesai = !AppState.s9Selesai; renderCurrentSlide(false); });

      // Slide 09 Lifting State Up
      const btnS10Add = document.getElementById('btnS10SimAdd');
      if (btnS10Add) btnS10Add.addEventListener('click', () => {
        AppState.s10TasksCount += 1;
        AppState.s10LastSignal = 'Anak (FormTugas) menelepon onTambah(judul) → State di Induk (App) bertambah!';
        renderCurrentSlide(false);
      });
      const btnS10Del = document.getElementById('btnS10SimDel');
      if (btnS10Del) btnS10Del.addEventListener('click', () => {
        AppState.s10TasksCount = Math.max(0, AppState.s10TasksCount - 1);
        AppState.s10LastSignal = 'Anak (ItemTugas) menelepon onHapus(id) → State di Induk (App) berkurang!';
        renderCurrentSlide(false);
      });

      // Slide 10 useEffect Dependency
      document.querySelectorAll('.btn-s11-mode').forEach((btn) => {
        btn.addEventListener('click', () => {
          AppState.s11DepMode = btn.getAttribute('data-s11-mode');
          AppState.s11Renders = 1;
          AppState.s11EffectRuns = 1;
          renderCurrentSlide(false);
        });
      });
      const btnS11Other = document.getElementById('btnS11OtherRender');
      if (btnS11Other) btnS11Other.addEventListener('click', () => {
        AppState.s11Renders += 1;
        if (AppState.s11DepMode === 'none') AppState.s11EffectRuns += 1;
        renderCurrentSlide(false);
      });
      const btnS11Change = document.getElementById('btnS11ChangeTugas');
      if (btnS11Change) btnS11Change.addEventListener('click', () => {
        AppState.s11Renders += 1;
        if (AppState.s11DepMode !== 'empty') AppState.s11EffectRuns += 1;
        renderCurrentSlide(false);
      });

      // Slide 11 File Explorer
      document.querySelectorAll('.btn-s12-file').forEach((btn) => {
        btn.addEventListener('click', () => {
          AppState.s12SelectedFile = parseInt(btn.getAttribute('data-s12-file'), 10);
          renderCurrentSlide(false);
        });
      });

      // Slide 12 CSS Demo Checkbox
      const chkS12Css = document.getElementById('chkS12CssDemo');
      if (chkS12Css) chkS12Css.addEventListener('change', () => {
        AppState.s12CssDemoSelesai = !AppState.s12CssDemoSelesai;
        renderCurrentSlide(false);
      });

      // Slide 13 Kartu.jsx Live
      const btnS13Run = document.getElementById('btnS13Run');
      if (btnS13Run) btnS13Run.addEventListener('click', () => {
        const j = document.getElementById('inputS13Judul');
        const c = document.getElementById('inputS13Children');
        if (j) AppState.s13Judul = j.value;
        if (c) AppState.s13Isi = c.value;
        renderCurrentSlide(false);
      });

      // Slide 14 Penghitung Keliru
      const btnS14Wrong = document.getElementById('btnS14ClickWrong');
      if (btnS14Wrong) btnS14Wrong.addEventListener('click', () => {
        AppState.s14InternalLet += 1;
        AppState.s14ConsoleLogs.push(`Nilai jumlah sekarang: ${AppState.s14InternalLet}`);
        renderCurrentSlide(false);
      });
      const btnS14Clear = document.getElementById('btnS14ClearConsole');
      if (btnS14Clear) btnS14Clear.addEventListener('click', () => {
        AppState.s14InternalLet = 0;
        AppState.s14ConsoleLogs = [];
        renderCurrentSlide(false);
      });

      // Slide 15 Penghitung Benar
      const btnS15Tambah = document.getElementById('btnS15Tambah');
      if (btnS15Tambah) btnS15Tambah.addEventListener('click', () => { AppState.s15Count += 1; renderCurrentSlide(false); });
      const btnS15Ulangi = document.getElementById('btnS15Ulangi');
      if (btnS15Ulangi) btnS15Ulangi.addEventListener('click', () => { AppState.s15Count = 0; renderCurrentSlide(false); });
      const btnS15Apply = document.getElementById('btnS15ApplyCode');
      if (btnS15Apply) btnS15Apply.addEventListener('click', () => {
        const t = document.getElementById('inputS15Target');
        const p = document.getElementById('inputS15Pesan');
        if (t) AppState.s15TargetKlik = Math.max(1, parseInt(t.value, 10) || 5);
        if (p) AppState.s15Pesan = p.value || 'Wah, kamu rajin sekali mengklik!';
        renderCurrentSlide(false);
      });

      // Slide 16 FormTugas Live
      const inputS16 = document.getElementById('inputS16Teks');
      if (inputS16) inputS16.addEventListener('input', (e) => {
        AppState.s16Teks = e.target.value;
        const tooLong = AppState.s16Teks.length > 50;
        const invalid = AppState.s16Teks.trim() === '' || tooLong;
        const btn = document.getElementById('btnS16Submit');
        const err = document.getElementById('s16ErrorText');
        if (btn) btn.disabled = invalid;
        if (err) err.classList.toggle('hidden', !tooLong);
      });
      const formS16 = document.getElementById('formS16Live');
      if (formS16) formS16.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!AppState.s16Teks.trim() || AppState.s16Teks.length > 50) return;
        AppState.s16ParentLogs.unshift(`"${AppState.s16Teks.trim()}"`);
        AppState.s16Teks = '';
        renderCurrentSlide(false);
      });

      // Slide 17 ItemTugas Live
      document.querySelectorAll('.chk-s17-item').forEach((chk) => {
        chk.addEventListener('change', () => {
          const id = parseInt(chk.getAttribute('data-s17-toggle'), 10);
          AppState.s17Items = AppState.s17Items.map((it) => it.id === id ? { ...it, selesai: !it.selesai } : it);
          renderCurrentSlide(false);
        });
      });
      document.querySelectorAll('.btn-s17-del').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-s17-del'), 10);
          AppState.s17Items = AppState.s17Items.filter((it) => it.id !== id);
          renderCurrentSlide(false);
        });
      });
      const btnS17Bug = document.getElementById('btnS17SimulateBug');
      if (btnS17Bug) btnS17Bug.addEventListener('click', () => {
        AppState.s17Items = [];
        AppState.s17BugSimulated = true;
        renderCurrentSlide(false);
      });
      const btnS17Reset = document.getElementById('btnS17Reset');
      if (btnS17Reset) btnS17Reset.addEventListener('click', () => {
        AppState.s17BugSimulated = false;
        AppState.s17Items = [
          { id: 1, judul: 'Install Node.js dan Vite', selesai: true },
          { id: 2, judul: 'Pelajari useState', selesai: false }
        ];
        renderCurrentSlide(false);
      });

      // Slide 18 & 19 Full App
      const inputS18 = document.getElementById('inputS18Teks');
      if (inputS18) inputS18.addEventListener('input', (e) => {
        AppState.s18Input = e.target.value;
        const tooLong = AppState.s18Input.length > 50;
        const invalid = AppState.s18Input.trim() === '' || tooLong;
        const btn = document.getElementById('btnS18Submit');
        const err = document.getElementById('s18ErrorText');
        if (btn) btn.disabled = invalid;
        if (err) err.classList.toggle('hidden', !tooLong);
      });
      const formS18 = document.getElementById('formS18App');
      if (formS18) formS18.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!AppState.s18Input.trim() || AppState.s18Input.length > 50) return;
        AppState.s18Tasks = [...AppState.s18Tasks, { id: Date.now(), judul: AppState.s18Input.trim(), selesai: false }];
        AppState.s18Input = '';
        renderCurrentSlide(false);
      });
      document.querySelectorAll('.chk-s18-item').forEach((chk) => {
        chk.addEventListener('change', () => {
          const id = parseInt(chk.getAttribute('data-s18-toggle'), 10);
          AppState.s18Tasks = AppState.s18Tasks.map((t) => t.id === id ? { ...t, selesai: !t.selesai } : t);
          renderCurrentSlide(false);
        });
      });
      document.querySelectorAll('.btn-s18-del').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-s18-del'), 10);
          AppState.s18Tasks = AppState.s18Tasks.filter((t) => t.id !== id);
          renderCurrentSlide(false);
        });
      });
      document.querySelectorAll('.btn-s18-scen').forEach((btn) => {
        btn.addEventListener('click', () => {
          const sc = btn.getAttribute('data-s18-scen');
          if (sc === '1') AppState.s18Tasks = [...AppState.s18Tasks, { id: Date.now(), judul: 'Kerjakan Laporan Modul 2', selesai: false }];
          if (sc === '2') AppState.s18Input = 'Judul tugas ini sengaja diketik sangat panjang melebihi batas maksimal 50 karakter';
          if (sc === '3') AppState.s18Tasks = AppState.s18Tasks.map((t, i) => i === 0 ? { ...t, selesai: !t.selesai } : t);
          if (sc === '4') AppState.s18Tasks = [];
          if (sc === '5') {
            AppState.s18Tasks = [
              { id: 1, judul: 'Install Node.js dan Vite', selesai: true },
              { id: 2, judul: 'Pelajari useState', selesai: false }
            ];
            AppState.s18Input = '';
          }
          renderCurrentSlide(false);
        });
      });

      const btnS19Refresh = document.getElementById('btnS19SimRefresh');
      if (btnS19Refresh) btnS19Refresh.addEventListener('click', () => {
        showToast('Refresh F5: Data tetap aman tersimpan di localStorage!');
        renderCurrentSlide(false);
      });
      const btnS19Add = document.getElementById('btnS19QuickAdd');
      if (btnS19Add) btnS19Add.addEventListener('click', () => {
        AppState.s18Tasks = [...AppState.s18Tasks, { id: Date.now(), judul: `Tugas Baru #${AppState.s18Tasks.length + 1}`, selesai: false }];
        renderCurrentSlide(false);
      });

      // Slide 20 FAQ
      document.querySelectorAll('.btn-s20-faq').forEach((btn) => {
        btn.addEventListener('click', () => {
          AppState.s20SelectedFAQ = parseInt(btn.getAttribute('data-s20-faq'), 10);
          renderCurrentSlide(false);
        });
      });

      // Slide 21 Tugas 1 & 2
      document.querySelectorAll('.btn-s21-filter').forEach((btn) => {
        btn.addEventListener('click', () => {
          AppState.s21Filter = btn.getAttribute('data-s21-filter');
          renderCurrentSlide(false);
        });
      });
      document.querySelectorAll('.chk-s21-item').forEach((chk) => {
        chk.addEventListener('change', () => {
          const id = parseInt(chk.getAttribute('data-s21-toggle'), 10);
          AppState.s21Tasks = AppState.s21Tasks.map((t) => t.id === id ? { ...t, selesai: !t.selesai } : t);
          renderCurrentSlide(false);
        });
      });
      const btnS21Clear = document.getElementById('btnS21ClearCompleted');
      if (btnS21Clear) btnS21Clear.addEventListener('click', () => {
        AppState.s21Tasks = AppState.s21Tasks.filter((t) => !t.selesai);
        renderCurrentSlide(false);
      });
      const btnS21Reset = document.getElementById('btnS21Reset');
      if (btnS21Reset) btnS21Reset.addEventListener('click', () => {
        AppState.s21Tasks = [
          { id: 1, judul: 'Install Node.js dan Vite', selesai: true },
          { id: 2, judul: 'Pelajari useState', selesai: false },
          { id: 3, judul: 'Buat Fitur Filter 3 Tombol', selesai: true }
        ];
        AppState.s21Filter = 'semua';
        renderCurrentSlide(false);
      });

      // Slide 22 Tugas 3 Keuangan
      const btnS22Bug = document.getElementById('btnS22ToggleNumberBug');
      if (btnS22Bug) btnS22Bug.addEventListener('click', () => {
        AppState.s22UseNumberConvert = !AppState.s22UseNumberConvert;
        renderCurrentSlide(false);
      });
      const formS22 = document.getElementById('formS22Keuangan');
      if (formS22) formS22.addEventListener('submit', (e) => {
        e.preventDefault();
        const k = document.getElementById('inputS22Ket');
        const n = document.getElementById('inputS22Nom');
        const j = document.getElementById('selectS22Jenis');
        if (!k || !n || !k.value.trim() || !n.value.trim()) return;
        AppState.s22Transaksi = [...AppState.s22Transaksi, { id: Date.now(), ket: k.value.trim(), nominal: Number(n.value), jenis: j ? j.value : 'pemasukan' }];
        renderCurrentSlide(false);
      });
      document.querySelectorAll('.btn-s22-del').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-s22-del'), 10);
          AppState.s22Transaksi = AppState.s22Transaksi.filter((t) => t.id !== id);
          renderCurrentSlide(false);
        });
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) {
          return;
        }
        if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          e.preventDefault();
          goToSlide(AppState.currentSlide + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          goToSlide(AppState.currentSlide - 1);
        }
      });

      renderCurrentSlide(true);
    });
  </script>
</body>
</html>
